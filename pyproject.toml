[project]
name = "alocador-de-salas"
version = "0.1.0"
description = "Alocador de salas para o PAS da UFFS Campus Chapeco."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "Flask==1.1.1",
    "gurobipy==10.0.2",
    "itsdangerous<2.1",
    "Jinja2<3.1",
    "MarkupSafe<2.1",
    "numpy==1.23.4",
    "odfpy>=1.4.1",
    "openpyxl==3.1.2",
    "pandas==1.5.1",
    "python-dotenv==1.0.1",
    "Werkzeug<2.1",
]

[project.scripts]
alocador-salas-solve = "alocador_salas.optimization.solve:main_cli"
alocador-salas-fixopt = "alocador_salas.optimization.main_fix_and_optimize:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
